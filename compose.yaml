# NovaLeave -- local development stack (spec_005 T205).
#
#   cp .env.example .env && docker compose up
#
# Serves http://localhost:8080 against a containerized SQL Server, with migrations and
# development seeding applied automatically on startup.

name: novaleave

services:
  db:
    # Pinned to an explicit cumulative update, never a floating tag (FR-016).
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    # The official image publishes amd64 manifests only. Declaring the platform turns an
    # obscure "no matching manifest" error on Apple Silicon into a documented, working
    # Rosetta emulation path (research.md R-002). Requires Docker Desktop's
    # "Use Rosetta for x86/amd64 emulation" setting.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env -- copy .env.example first}
      MSSQL_PID: Developer
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      # Named volume: data survives `compose down`, and is discarded only by
      # `compose down -v` (FR-009, FR-010).
      - novaleave-db-data:/var/opt/mssql
    healthcheck:
      # Executes a real query rather than probing the port. SQL Server accepts TCP
      # connections well before it can answer queries, and the gap is wider under
      # emulation -- port-based checks are why cold starts fail intermittently (R-003).
      # Note: mssql-tools18 requires -C to trust the container's self-signed certificate;
      # examples written for 2019 use a different path and silently never pass.
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      # Generous: first boot builds system databases, and does so under emulation.
      start_period: 90s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    depends_on:
      db:
        # Waits for the healthcheck above, not merely for the container to start (FR-004).
        condition: service_healthy
    environment:
      # Stays Development so the seeder runs and detailed errors are available.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Two listeners: 8080 serves the application, 9464 serves ONLY /metrics.
      # 9464 is deliberately absent from `ports:` below, so it exists solely on the Docker
      # network. Serving metrics on 8080 would expose them to anyone who can reach the app,
      # because publishing a port publishes every path on it (spec_007 T401, FR-018).
      ASPNETCORE_HTTP_PORTS: "8080;9464"
      # spec_009: CLEF JSON on stdout so Loki stores queryable fields rather than one opaque
      # string. `docker compose logs -f web` is still usable -- pipe it through `jq`.
      Serilog__ConsoleFormat: json
      # Supplied as an environment variable rather than an appsettings file: environment
      # configuration outranks appsettings.Development.json, so this overrides the LocalDB
      # connection string without editing a tracked file, and keeps the password out of
      # the repository (FR-011).
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=NovaLeave;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;MultipleActiveResultSets=True"
    ports:
      # Only the application port. 9464 is intentionally NOT listed -- that omission is the
      # control that keeps /metrics off the host (FR-018).
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # Source is mounted, not copied, so dotnet watch sees edits (FR-015).
      - .:/src
      # Anonymous volumes mask every build directory inside the mount. Without these, the
      # host's bin/obj (built by a different SDK, on a different OS) shadow the
      # container's and produce build failures that look like source errors (R-005).
      - /src/src/NovaLeave.Domain/bin
      - /src/src/NovaLeave.Domain/obj
      - /src/src/NovaLeave.Application/bin
      - /src/src/NovaLeave.Application/obj
      - /src/src/NovaLeave.Infrastructure/bin
      - /src/src/NovaLeave.Infrastructure/obj
      - /src/src/NovaLeave.Presentation.Web/bin
      - /src/src/NovaLeave.Presentation.Web/obj
      # Persist the NuGet cache so a rebuild does not re-download packages.
      - novaleave-nuget:/root/.nuget/packages
      # Persist Data Protection keys. Without this the keyring is regenerated on every
      # container recreate, silently invalidating every session cookie -- which presents
      # as "the app logged me out again" rather than as a configuration issue.
      - novaleave-dpkeys:/root/.aspnet/DataProtection-Keys
    restart: unless-stopped

  # spec_007 T305: metrics collection.
  prometheus:
    # Pinned to an explicit version, verified against the registry (FR-015, Constitution §7.2).
    # Multi-arch, so unlike SQL Server it runs natively on arm64 -- no emulation.
    image: prom/prometheus:v3.14.0
    depends_on:
      - web
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Development retention. A deployed instance needs this sized deliberately (GAP-007-3).
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      # Published so you can use Prometheus's expression browser directly. This exposes
      # Prometheus, NOT the application's /metrics endpoint, which stays internal (FR-018).
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      # Read-only: the repository is the source of truth for scrape configuration. A writable
      # mount invites drift between what is committed and what is running (research.md R-008).
      #
      # The DIRECTORY is mounted, not the single file. Editing a bind-mounted file with any tool
      # that writes a new inode (sed -i, most editors' atomic save) leaves the container pointing
      # at the deleted original, and Prometheus then fails config reload with
      # "no such file or directory" until the container is recreated.
      - ./docker/prometheus:/etc/prometheus:ro
      - novaleave-prometheus-data:/prometheus
    restart: unless-stopped

  # spec_007 T305: dashboards.
  grafana:
    image: grafana/grafana:13.2.2
    depends_on:
      - prometheus
    environment:
      # From .env, never committed (FR-019). Development-only credentials.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env -- copy .env.example first}
      # No anonymous access: metrics disclose route names, traffic volume and error patterns.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Nothing here should phone home from a development machine.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      # Read-only provisioning: dashboards and datasources are code, not container state.
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - novaleave-grafana-data:/var/lib/grafana
    restart: unless-stopped

  # spec_009 T301: log storage.
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      # Published for direct API access while developing. Like Prometheus, Loki has NO
      # authentication -- acceptable bound to localhost, not in a deployed environment
      # (GAP-009-2).
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      # Directory, not a single file: editing a bind-mounted file replaces its inode and
      # leaves the container pointing at a deleted path (learned in spec_007 T401).
      - ./docker/loki:/etc/loki:ro
      - novaleave-loki-data:/loki
    restart: unless-stopped

  # spec_009 T302: log shipping. Reads container stdout via the Docker API and pushes to Loki.
  alloy:
    image: grafana/alloy:v1.19.2
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./docker/alloy:/etc/alloy:ro
      - novaleave-alloy-data:/var/lib/alloy/data
      # SECURITY: access to the Docker socket is effectively root on the Docker daemon -- it
      # can start privileged containers and mount the host filesystem. `:ro` restricts writes
      # to the socket FILE, not the API, so it is NOT a meaningful boundary here.
      #
      # Accepted for a local development stack because the alternative (a Serilog sink pushing
      # to Loki) loses exactly the logs worth having: those from a crash during startup.
      # A deployed environment must ship logs another way -- see GAP-009-1.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The alloy user cannot read the Docker socket, which is root:docker on the host VM.
    user: root
    restart: unless-stopped

  # spec_010: operations agent team (docker/agents/ops-team.yaml), cloud model.
  #
  #   docker compose run --rm ops-agent
  #
  # Interactive, so it is run, never `up`-ed. The `agents` profile keeps it out of a plain
  # `docker compose up`, which starts exactly the services above (FR-011); `compose run` enables
  # a target service's profile by itself.
  ops-agent:
    # Pinned to an explicit version, verified against Docker Hub (Constitution §7.2). The
    # official image ships the docker CLI, which the devenv agent's tools use.
    image: docker/docker-agent:1.140.0
    profiles: ["agents"]
    # Entrypoint rather than command, so arguments after the service name are APPENDED:
    # `docker compose run --rm ops-agent --debug` works instead of replacing the config path.
    entrypoint: ["/docker-agent", "run", "/agents/ops-team.yaml"]
    # Deliberately no depends_on: starting this must not boot the stack. "Nothing is running"
    # is an answer the devenv agent should be able to give.
    environment:
      # Empty is allowed so ops-agent-local works without a key. The cloud run then fails at
      # startup with docker-agent's own missing-credential message.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      DOCKER_AGENT_NO_TOUR: "1"
      # Nothing here should phone home from a development machine (as for Grafana above).
      # docker-agent telemetry is on by default and its command events include positional
      # arguments -- which can be the prompt itself (FR-010).
      TELEMETRY_ENABLED: "false"
    volumes:
      # Read-only: agent definitions are code, reviewed like any other file.
      - ./docker/agents:/agents:ro
      # Session history and the todo store survive `run --rm`.
      - novaleave-agent-data:/root/.cagent
      # SECURITY: same exposure as alloy -- socket access is effectively root on the Docker
      # daemon, and `:ro` does not restrict the API. What bounds it here is that the agent has
      # no shell: only three fixed, read-only script tools with enum arguments (ops-team.yaml),
      # and inspect output is limited to .State so container environments -- which hold the SA
      # and Grafana passwords -- never reach the model. Development only; ADR-003, GAP-010-2.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The image's default user cannot read the Docker socket (see alloy above).
    user: root
    stdin_open: true
    tty: true

  # spec_010: the same team on a local model through Docker Model Runner.
  #
  #   docker desktop enable model-runner
  #   docker compose run --rm ops-agent-local
  #
  # A separate service rather than a flag, because binding `models:` makes Compose require
  # Model Runner -- the cloud service must not depend on it.
  ops-agent-local:
    extends:
      service: ops-agent
    entrypoint: ["/docker-agent", "run", "/agents/ops-team.yaml", "--flavor", "local"]
    models:
      agent-llm:
        # Names read by the `local` flavor in ops-team.yaml. Compose fills them with the model's
        # OpenAI-compatible endpoint and its id.
        endpoint_var: AGENT_LLM_URL
        model_var: AGENT_LOCAL_MODEL

# spec_010: models are infrastructure dependencies, declared like images. Compose pulls and
# starts this through Docker Model Runner only when a service that binds it is started.
models:
  agent-llm:
    # Pinned tag, not `ai/qwen3` (Constitution §7.2). 8B at Q4_K_M is ~5 GB: fits alongside the
    # stack on a 16 GB machine and supports tool calling. Keep in step with dev-team.yaml.
    model: ai/qwen3:8b-q4_K_M
    context_size: 16384

volumes:
  novaleave-db-data:
  novaleave-nuget:
  novaleave-dpkeys:
  novaleave-prometheus-data:
  novaleave-grafana-data:
  novaleave-loki-data:
  novaleave-alloy-data:
  novaleave-agent-data:
